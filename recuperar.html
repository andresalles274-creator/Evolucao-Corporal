<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d09">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title>Recuperar acesso — Evolução Corporal</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:radial-gradient(circle at 70% 10%,#1e3a18,#080d09 65%);color:#f5fff1;padding:20px}
main{width:min(100%,460px);padding:30px 22px;border:1px solid #465c3a;border-radius:22px;background:#101a11;box-shadow:0 24px 60px #0007;text-align:center}
.logo{font-size:36px;color:#caff18;font-weight:900;letter-spacing:-3px;margin-bottom:12px}
h1{font-size:25px;margin:2px 0 12px}
p{color:#bacab7;line-height:1.55}
#status{margin:18px 0;min-height:50px;padding:14px;border:1px solid #354e2b;border-radius:14px;background:#172316;font-size:14px;line-height:1.5}
button{width:100%;min-height:50px;background:#caff18;color:#101600;font-weight:800;border:0;border-radius:13px;font-size:16px;cursor:pointer}
button:disabled{opacity:.55}
small{display:block;color:#9cad96;margin-top:14px;font-size:12px;line-height:1.6}
</style>
</head>
<body>
<main>
<div class="logo" aria-hidden="true">▲</div>
<h1>Recuperar Evolução Corporal</h1>
<p>Vamos remover somente arquivos temporários antigos do aplicativo e carregar a versão corrigida.</p>
<div id="status" role="status" aria-live="polite">Iniciando verificação da atualização…</div>
<button id="repair" type="button">Repetir recuperação</button>
<small>Seus dados, treinos, dietas, fotos e avaliações permanecem salvos na sua conta.</small>
</main>
<script>
(function(){
"use strict";
const status=document.getElementById("status");
const button=document.getElementById("repair");
let busy=false;
async function recover(){
 if(busy)return;
 busy=true;button.disabled=true;status.textContent="Limpando versões antigas…";
 try{
  if("serviceWorker" in navigator){
   const regs=await navigator.serviceWorker.getRegistrations();
   await Promise.all(regs.filter(r=>r.scope.includes("/Evolucao-Corporal/")).map(r=>r.unregister()));
  }
  if("caches" in window){
   const names=await caches.keys();
   await Promise.all(names.filter(k=>k.startsWith("evolucao-corporal-")).map(k=>caches.delete(k)));
  }
  status.textContent="Verificando a versão corrigida no servidor…";
  const stamp=Date.now().toString(36);
  const response=await fetch("./index.html?reparo="+stamp,{cache:"no-store",redirect:"follow"});
  if(!response.ok)throw new Error("O servidor retornou "+response.status);
  const content=await response.text();
  if(!content.includes("app.js?v=10.8.0")){
   status.textContent="O site ainda está entregando uma versão anterior. Os arquivos temporários já foram removidos. Toque em Repetir recuperação para verificar novamente.";
   return;
  }
  const scriptResponse=await fetch("./app.js?v=10.8.0&verificacao="+stamp,{cache:"no-store"});
  if(!scriptResponse.ok)throw new Error("O novo aplicativo ainda não está disponível");
  const script=await scriptResponse.text();
  if(!script.includes('const APP_VERSION="10.8.0"')||!script.includes('document.querySelectorAll(".exercise-image-form").forEach')){
   status.textContent="O navegador ainda recebe um arquivo antigo. Toque em Repetir recuperação para testar novamente.";
   return;
  }
  status.textContent="Versão corrigida encontrada. Abrindo o aplicativo…";
  window.location.replace("./index.html?atualizado="+stamp);
 }catch(err){
  status.textContent="Não foi possível concluir a recuperação: "+String(err&&err.message||err)+". Verifique sua conexão e toque no botão para tentar novamente.";
 }finally{busy=false;button.disabled=false;}
}
button.addEventListener("click",recover);
recover();
})();
</script>
</body></html>
