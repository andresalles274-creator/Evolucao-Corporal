name: Deploy Evolucao Corporal to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Wait for artifact metadata
        uses: actions/github-script@v7
        with:
          script: |
            const name = `github-pages-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}`;
            for (let attempt = 0; attempt < 12; attempt++) {
              const result = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId
              });
              if (result.data.artifacts.some(item => item.name === name)) return;
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            core.setFailed('The uploaded Pages artifact is not yet available.');
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
