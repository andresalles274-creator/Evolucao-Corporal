name: Deploy Evolucao Corporal to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Deploy Pages through REST API
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const name = `github-pages-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}`;
            let artifact;
            for (let attempt = 0; attempt < 12; attempt++) {
              const result = await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner, repo: context.repo.repo, run_id: context.runId
              });
              artifact = result.data.artifacts.find(item => item.name === name);
              if (artifact) break;
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            if (!artifact) throw new Error('The uploaded Pages artifact is not yet available.');
            const oidc = await core.getIDToken();
            core.setSecret(oidc);
            const repo = {owner: context.repo.owner, repo: context.repo.repo};
            const created = await github.request('POST /repos/{owner}/{repo}/pages/deployments', {
              ...repo, artifact_id: artifact.id, pages_build_version: context.sha, oidc_token: oidc
            });
            core.setOutput('page_url', created.data.page_url);
            for (let attempt = 0; attempt < 60; attempt++) {
              const result = await github.request('GET /repos/{owner}/{repo}/pages/deployments/{deployment_id}', {
                ...repo, deployment_id: created.data.id
              });
              const status = result.data.status;
              core.info(`Pages deployment: ${status}`);
              if (status === 'succeed') return;
              if (['deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost', 'failed', 'cancelled'].includes(status)) {
                throw new Error(`Pages deployment failed: ${status}`);
              }
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            throw new Error('Pages deployment timed out.');
