name: Build Android APK (Evolucao Corporal)

on:
  push:
    branches: [main]
    paths:
      - "android-app/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: evolucao-android-apk
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Baixar codigo
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Instalar Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Compilar APK Android
        run: gradle -p android-app --no-daemon --stacktrace assembleDebug

      - name: Verificar assinatura e copiar APK
        shell: bash
        run: |
          set -euo pipefail
          APK="android-app/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" "Evolucao-Corporal.apk"
          sha256sum "Evolucao-Corporal.apk"

      - name: Disponibilizar arquivo no GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: Evolucao-Corporal-Android-APK
          path: Evolucao-Corporal.apk
          if-no-files-found: error
          retention-days: 90

      - name: Publicar APK em GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_TAG="android-v1.1.0"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" Evolucao-Corporal.apk --clobber
          else
            gh release create "$RELEASE_TAG" Evolucao-Corporal.apk \
              --target "$GITHUB_SHA" \
              --title "Evolucao Corporal Android v1.1.0 — Icone preto e vermelho" \
              --notes "Novo icone do aplicativo em preto e vermelho. Mesmo login e todos os dados no Supabase. Esta versao de teste e assinada com chave de desenvolvimento temporaria; pode ser necessario desinstalar a versao APK anterior antes de instalar. O login precisara ser refeito depois. O arquivo anterior foi preservado no release v1.0.0." \
              --prerelease
          fi
