<script>
'use strict';
const catalogue={whey:{n:'Whey protein',unit:'g',k:4,p:.8,c:.08,f:.05},riceflour:{n:'Farinha de arroz pré-cozida',unit:'g',k:3.6,p:.06,c:.8,f:.005},neston:{n:'Mucilon Multicereais',unit:'g',k:3.81,p:.086,c:.857,f:0},milkyflour:{n:'Farinha láctea',unit:'g',k:4.1,p:.09,c:.77,f:.05},milk:{n:'Leite desnatado',unit:'ml',k:.35,p:.035,c:.05,f:.001},peanut:{n:'Amendoim torrado moído',unit:'g',k:6,p:.25,c:.2,f:.5},rice:{n:'Arroz branco cozido',unit:'g',k:1.3,p:.026,c:.28,f:.003},chicken:{n:'Peito de frango cozido',unit:'g',k:1.65,p:.31,c:0,f:.036},veggies:{n:'Legumes e verduras',unit:'g',k:.35,p:.02,c:.06,f:.002},oil:{n:'Azeite',unit:'g',k:9,p:0,c:0,f:1},banana:{n:'Banana',unit:'g',k:.89,p:.011,c:.23,f:.003},oats:{n:'Aveia',unit:'g',k:3.89,p:.17,c:.66,f:.07},egg:{n:'Ovos inteiros cozidos (2 un. ≈ 100 g)',unit:'g',k:1.55,p:.13,c:.01,f:.11}};
const shakes=[{key:'egg',qty:100},{key:'riceflour',qty:30},{key:'neston',qty:20},{key:'milkyflour',qty:10},{key:'milk',qty:200},{key:'peanut',qty:10}];
const solids=[{key:'rice',qty:200},{key:'chicken',qty:190},{key:'veggies',qty:150},{key:'oil',qty:10}];
function defaults(){return {version:1,targets:{kcal:2670,protein:210,carbs:310,fat:57},meals:[{id:'m1',title:'Shake da manhã + ovos',kind:'shake',time:'1ª REFEIÇÃO',foods:structuredCloneSafe(shakes)},{id:'m2',title:'Almoço',kind:'food',time:'2ª REFEIÇÃO',foods:structuredCloneSafe(solids)},{id:'m3',title:'Shake do treino + ovos',kind:'shake',time:'3ª REFEIÇÃO',foods:structuredCloneSafe(shakes)},{id:'m4',title:'Jantar',kind:'food',time:'4ª REFEIÇÃO',foods:structuredCloneSafe(solids)},{id:'m5',title:'Shake da noite + ovos',kind:'shake',time:'5ª REFEIÇÃO',foods:structuredCloneSafe(shakes)}],checks:{}};}
function structuredCloneSafe(v){return JSON.parse(JSON.stringify(v));}
// O catálogo é baixado junto com a dieta e guardado no aparelho para uso offline.
// Assim, novos alimentos, nomes e valores nutricionais não exigem novo APK.
function parseFoodCatalogue(source){
  if(source==null)return {};
  if(typeof source!=='object'||Array.isArray(source))throw Error('Catálogo inválido');
  const entries=Object.entries(source);
  if(entries.length>200)throw Error('Catálogo muito grande');
  const parsed=Object.create(null);
  for(const [key,item] of entries){
    if(!/^[a-z][a-z0-9_-]{0,39}$/.test(key)||['__proto__','prototype','constructor'].includes(key))throw Error('Chave inválida');
    if(!item||typeof item!=='object'||Array.isArray(item)||typeof item.n!=='string'||!item.n.trim()||item.n.length>90||!['g','ml','un'].includes(item.unit))throw Error('Alimento inválido');
    const x={n:item.n.trim(),unit:item.unit};
    for(const k of ['k','p','c','f']){
      if(typeof item[k]!=='number'||!Number.isFinite(item[k])||item[k]<0||item[k]>(k==='k'?100:10))throw Error('Nutriente inválido');
      x[k]=item[k];
    }
    parsed[key]=x;
  }
  return parsed;
}
function load(){
  try{
    const d=JSON.parse(localStorage.getItem('minhadieta-v1'));
    const savedFoods=parseFoodCatalogue(d&&d.foodCatalogue);
    if(validState(d,{...catalogue,...savedFoods})){
      Object.assign(catalogue,savedFoods);
      return d;
    }
  }catch(e){}
  return defaults();
}
function validState(v,knownFoods=catalogue){return v&&Array.isArray(v.meals)&&v.meals.length>=1&&v.meals.length<=15&&v.meals.every(m=>m&&typeof m.title==='string'&&Array.isArray(m.foods)&&m.foods.every(f=>knownFoods[f.key]&&Number.isFinite(+f.qty)&&+f.qty>=0&&+f.qty<=3000));}
let state=load(),page='today',currentMeal=null;const n=v=>Math.round(v),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const day=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function save(){localStorage.setItem('minhadieta-v1',JSON.stringify(state));}
function macros(meal){return meal.foods.reduce((m,f)=>{const x=catalogue[f.key];for(const k of ['k','p','c','f'])m[k]+=(+f.qty||0)*x[k];return m},{k:0,p:0,c:0,f:0});}
function total(){return state.meals.reduce((s,m)=>{const x=macros(m);for(const k of ['k','p','c','f'])s[k]+=x[k];return s},{k:0,p:0,c:0,f:0});}
function done(){return state.checks[day()]||[];}function toggle(id){const d=new Set(done());d.has(id)?d.delete(id):d.add(id);state.checks[day()]=[...d];save();render();}
function navigate(p){page=p;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===p));render();}
function render(){const el=document.getElementById('screen');if(page==='settings')return el.innerHTML=settingsHTML();if(page==='history')return el.innerHTML=historyHTML();const t=total(),completed=done();const consumed=state.meals.filter(m=>completed.includes(m.id)).reduce((s,m)=>s+macros(m).k,0);const fmt=new Intl.DateTimeFormat('pt-BR',{weekday:'long',day:'numeric',month:'long'}).format(new Date());let out=`<section class="premium-brand" aria-label="Minha Dieta Neon"><div class="premium-brand-content"><div class="poster-brand-title"><strong>MINHA DIETA</strong><small>NEON</small></div><div class="poster-brand-tag">CONTROLE ALIMENTAR</div></div></section><div class="eyebrow">PLANO ALIMENTAR • 98 KG</div><div class="pageTitle">Sua dieta de hoje.</div><div class="quiet">${esc(fmt)} · Ganho muscular controlado</div><div id="sync-status" class="sync-status">Dieta disponível offline</div><section class="hero"><div class="heroHead"><div><div class="eyebrow">CALORIAS PLANEJADAS</div><div class="heroNum">${n(t.k).toLocaleString('pt-BR')} <small>kcal</small></div></div><span style="font-size:28px">🔥</span></div><div class="target">Meta de referência: ${n(state.targets.kcal)} kcal · Consumidas: ${n(consumed)} kcal</div><div class="progress"><div style="width:${Math.min(100,Math.round(consumed/Math.max(1,t.k)*100))}%"></div></div></section><div class="macros"><div class="macro"><b>${n(t.p)}g</b><span>PROTEÍNAS</span></div><div class="macro"><b>${n(t.c)}g</b><span>CARBOIDRATOS</span></div><div class="macro"><b>${n(t.f)}g</b><span>GORDURAS</span></div></div><div class="sectionTitle"><h2>Suas 5 refeições</h2><div class="count">${completed.length}/${state.meals.length} concluídas</div></div>`;for(const m of state.meals){const x=macros(m),checked=completed.includes(m.id),isShake=m.kind==='shake',desc=m.foods.map(f=>`${n(f.qty)}${catalogue[f.key].unit} ${catalogue[f.key].n}`).slice(0,2).join(' · ');out+=`<article class="meal ${checked?'checked':''}"><button type="button" class="mealMain mealOpen" onclick="viewMeal('${esc(m.id)}')" aria-label="Ver todos os ingredientes de ${esc(m.title)}"><div class="photo"><div class="emoji">${isShake?'🥤':'🍱'}</div><img src="${isShake?'shake.jpg':'meal.jpg'}" alt="${isShake?'Shake proteico':'Arroz, frango e legumes'}" onerror="this.style.display='none'"></div><div class="mealText"><div class="mealTag">${esc(m.time||'REFEIÇÃO')}</div><div class="mealTitle">${esc(m.title)}</div><div class="mealDesc">${esc(desc)}</div><div class="mealMacro"><b>${n(x.k)} kcal</b>${n(x.p)}g prot. · ${n(x.c)}g carb.</div></div></button><div class="actions"><button onclick="editMeal('${esc(m.id)}')">✎ Editar porções</button><button class="${checked?'isDone':'done'}" onclick="toggle('${esc(m.id)}')">${checked?'✓ Concluída':'○ Marcar como feita'}</button></div></article>`;}out+='<div class="note">Valores nutricionais aproximados, sujeitos às marcas e ao preparo. A farinha de arroz deve ser pré-cozida ou preparada antes do consumo. Ovos devem ser consumidos cozidos ou bem preparados, separados do shake. O registro fica somente neste aparelho.</div>';el.innerHTML=out;}
function historyHTML(){const entries=Object.entries(state.checks).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,30);return `<div class="eyebrow">ACOMPANHAMENTO</div><div class="pageTitle">Histórico</div><p class="quiet">Registros salvos no seu celular, mesmo sem internet.</p><div class="settingsCard"><h3>Dias registrados</h3>${entries.length?entries.map(([date,ids])=>`<div class="dailyRow"><span>${esc(date.split('-').reverse().join('/'))}</span><b>${ids.length}/${state.meals.length} refeições</b></div>`).join(''):'<p>Nenhum dia registrado ainda. Marque as refeições de hoje para começar.</p>'}</div>`;}
function settingsHTML(){return `<div class="eyebrow">CONTROLE PESSOAL</div><div class="pageTitle">Ajustes</div><p class="quiet">Sem senha e sem login. A dieta funciona offline e busca novas alterações automaticamente quando houver internet.</p><div class="settingsCard"><h3>🎯 Metas diárias</h3><div class="field"><label>Calorias (kcal)</label><input id="goalK" type="number" min="1000" max="5000" value="${n(state.targets.kcal)}"></div><div class="field"><label>Proteínas (g)</label><input id="goalP" type="number" min="0" max="500" value="${n(state.targets.protein)}"></div><button class="btn" onclick="saveGoals()">Salvar metas</button></div><div class="settingsCard"><h3>↻ Atualização automática</h3><p>Peça as alterações da dieta no ChatGPT. Quando eu salvar a nova versão, este aplicativo a recebe sozinho ao abrir com internet. Os registros anteriores continuam no aparelho.</p><button class="btn" onclick="requestDietSync()">Verificar nova dieta agora</button><p>Última versão recebida: <b id="remote-version">${state.remoteRevision||"padrão"}</b></p><button class="btn secondary" onclick="exportDiet()">Exportar cópia de segurança</button><button class="btn secondary" onclick="importDiet()">Restaurar backup de uma versão anterior</button></div><div class="settingsCard"><h3>🔐 Privacidade</h3><p>Todas as informações ficam armazenadas localmente no celular. Não existe login nem publicidade. Somente a lista de alimentos e metas do plano é consultada pela internet. Seu histórico e registros de refeições não são enviados.</p><p>Desinstalar o aplicativo pode apagar os dados. Exporte um backup antes.</p></div>`;}
function saveGoals(){state.targets.kcal=Math.max(1000,Math.min(5000,+document.getElementById('goalK').value||2670));state.targets.protein=Math.max(0,Math.min(500,+document.getElementById('goalP').value||210));save();render();alert('Metas atualizadas.');}
function viewMeal(id){
  const m=state.meals.find(x=>x.id===id);if(!m)return;
  const x=macros(m);
  const ingredients=m.foods.map(f=>{
    const food=catalogue[f.key];if(!food)return '';
    return `<div class="ingred readIngred"><span>${esc(food.n)}</span><strong>${Number(f.qty).toLocaleString('pt-BR',{maximumFractionDigits:1})} ${food.unit}</strong></div>`;
  }).join('');
  document.getElementById('sheet').innerHTML=
    `<div class="eyebrow">DETALHES DA REFEIÇÃO</div><h2>${esc(m.title)}</h2><p class="quiet">${esc(m.time||'')} • Todos os ingredientes e quantidades</p><div class="ingredients">${ingredients}</div><div class="detailTotals"><span>${n(x.k)} kcal</span><span>${n(x.p)} g proteína</span><span>${n(x.c)} g carboidratos</span><span>${n(x.f)} g gorduras</span></div><button class="btn secondary" onclick="closeSheet()">Fechar</button>`;
  openSheet();
}
function editMeal(id){const m=state.meals.find(x=>x.id===id);if(!m)return;currentMeal=id;let items=m.foods.map((f,i)=>`<div class="ingred"><span>${esc(catalogue[f.key].n)}</span><input type="number" inputmode="decimal" min="0" max="3000" step="1" data-idx="${i}" value="${+f.qty}" aria-label="Quantidade de ${esc(catalogue[f.key].n)}"><span class="unit">${catalogue[f.key].unit}</span></div>`).join('');document.getElementById('sheet').innerHTML=`<div class="eyebrow">AJUSTAR ALIMENTAÇÃO</div><h2>${esc(m.title)}</h2><div class="ingredients">${items}</div><div class="field"><label>Adicionar alimento</label><select id="newfood"><option value="">Selecione...</option>${Object.entries(catalogue).filter(([k])=>!m.foods.some(f=>f.key===k)).map(([k,v])=>`<option value="${k}">${esc(v.n)}</option>`).join('')}</select></div><button class="smallBtn" onclick="addFood()">+ Adicionar alimento</button><button class="btn" onclick="saveMeal()">Salvar quantidades</button><button class="btn secondary" onclick="closeSheet()">Cancelar</button>`;openSheet();}
function saveMeal(){const m=state.meals.find(x=>x.id===currentMeal);document.querySelectorAll('.ingred input').forEach(input=>{const idx=+input.dataset.idx;if(m.foods[idx])m.foods[idx].qty=Math.max(0,Math.min(3000,+input.value||0));});save();closeSheet();render();}
function addFood(){const key=document.getElementById('newfood').value;if(!key||!catalogue[key])return;saveMeal();const m=state.meals.find(x=>x.id===currentMeal);if(!m)return;m.foods.push({key,qty:100});save();editMeal(m.id);}
function openSheet(){document.querySelector('.sheetBackdrop').classList.add('show');document.getElementById('sheet').classList.add('show');}function closeSheet(){document.querySelector('.sheetBackdrop').classList.remove('show');document.getElementById('sheet').classList.remove('show');}function showSettings(){navigate('settings')}
function importDiet(){if(window.Android&&Android.importDiet){Android.importDiet();}else{alert('A importação funciona no APK Android.');}}
function exportDiet(){const json=JSON.stringify(state,null,2);if(window.Android&&Android.exportDiet){Android.exportDiet(json);}else{alert('Exportação disponível no APK Android.');}}
window.receiveDietImport=function(json){try{const d=JSON.parse(json);const foods=parseFoodCatalogue(d.foodCatalogue);if(!validState(d,{...catalogue,...foods}))throw Error('Formato inválido');const original=(d.checks&&typeof d.checks==='object'&&!Array.isArray(d.checks))?d.checks:(state.checks||{});Object.assign(catalogue,foods);state={version:3,remoteRevision:Number.isSafeInteger(d.remoteRevision)?d.remoteRevision:0,meals:d.meals.map((m,i)=>({id:String(m.id||('m'+(i+1))),title:String(m.title).slice(0,80),time:String(m.time||`${i+1}ª REFEIÇÃO`).slice(0,30),kind:m.kind==='food'?'food':'shake',foods:m.foods.map(f=>({key:f.key,qty:+f.qty}))})),foodCatalogue:{...(state.foodCatalogue||{}),...foods},targets:{...defaults().targets,...(d.targets||{})},checks:original};save();navigate('today');alert('Backup restaurado. Suas refeições e registros foram recuperados; novos ajustes chegam automaticamente.');}catch(e){alert('Não foi possível importar este arquivo de dieta.');}};

function syncMessage(msg){const el=document.getElementById('sync-status');if(el)el.textContent=msg;}
window.requestDietSync=function(){
  syncMessage('Verificando ajustes da dieta…');
  if(window.Android&&typeof Android.syncDiet==='function')Android.syncDiet();
  else syncMessage('Modo offline: dieta salva no aparelho');
};
window.receiveDietSync=function(json){
  try{
    const d=JSON.parse(json);
    if(!Number.isSafeInteger(d.revision)||d.revision<1||d.revision>1000000)throw Error('Versão inválida');
    const remoteFoods=parseFoodCatalogue(d.catalogue);
    if(!validState(d,{...catalogue,...remoteFoods}))throw Error('Plano inválido');
    if((state.remoteRevision||0)>=d.revision){
      // Ao migrar de APK antigo, também recebe o catálogo mesmo se a dieta já tiver esta revisão.
      const saved=state.foodCatalogue||{};
      const changed=Object.entries(remoteFoods).some(([key,food])=>JSON.stringify(saved[key])!==JSON.stringify(food));
      if(changed){
        Object.assign(catalogue,remoteFoods);
        state.foodCatalogue={...saved,...remoteFoods};
        save();render();
        syncMessage('✓ Alimentos atualizados • versão '+d.revision);
      }else syncMessage('Dieta sincronizada • versão '+d.revision);
      return;
    }
    const completed=state.checks||{};
    const meals=d.meals.map((m,i)=>({id:String(m.id||('m'+(i+1))).slice(0,40),title:String(m.title).slice(0,80),time:String(m.time||((i+1)+'ª REFEIÇÃO')).slice(0,40),kind:m.kind==='food'?'food':'shake',foods:m.foods.map(f=>({key:f.key,qty:Number(f.qty)}))}));
    Object.assign(catalogue,remoteFoods);
    state={version:3,remoteRevision:d.revision,meals,foodCatalogue:{...(state.foodCatalogue||{}),...remoteFoods},targets:{...defaults().targets,...d.targets},checks:completed};
    save();render();syncMessage('✓ Nova dieta aplicada • versão '+d.revision);
  }catch(e){syncMessage('Dieta salva no aparelho • falha na atualização');}
};
window.receiveDietSyncError=function(){syncMessage('Sem conexão • dieta offline disponível');};

window.onAndroidBack=function(){if(document.getElementById('sheet').classList.contains('show'))closeSheet();else navigate('today');};
let currentCalendarDay=day();
function refreshCalendarDay(){
  const next=day();
  if(next!==currentCalendarDay){
    currentCalendarDay=next;
    closeSheet();
    render();
  }
}
setInterval(refreshCalendarDay,30000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)refreshCalendarDay()});
window.addEventListener('focus',refreshCalendarDay);
render();
</script></body></html>
