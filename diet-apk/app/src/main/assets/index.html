<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08080b"><title>Minha Dieta • André22</title>
<style>
:root{--bg:#08080b;--panel:#121216;--panel2:#19191e;--line:#2e2529;--red:#f02b45;--bright:#ff4054;--txt:#f6f3f4;--muted:#a7a2a7}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Roboto,'Arial',sans-serif;color:var(--txt);background:var(--bg)}body{background:radial-gradient(circle at 95% 0%,#3b0a1828,transparent 40%),var(--bg)}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:600px;margin:auto;min-height:100vh;padding-bottom:110px}.top{padding:23px 19px 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #292127}.brand{display:flex;gap:12px;align-items:center}.brandicon{width:47px;height:47px;border:1px solid #bf2840;border-radius:15px;display:grid;place-items:center;background:linear-gradient(145deg,#570f26,#180d14);box-shadow:0 0 24px #e6224129;font-size:25px}.name{font-weight:900;letter-spacing:.04em;font-size:16px}.name em{font-style:normal;color:var(--bright)}.sub{color:var(--muted);font-size:11px;margin-top:4px;letter-spacing:.08em}.circleBtn{width:38px;height:38px;border-radius:12px;background:#1d151a;border:1px solid #65303a;color:#fff;font-size:20px}.content{padding:19px}.eyebrow{color:#fb6777;text-transform:uppercase;font-size:10px;font-weight:900;letter-spacing:.18em}.pageTitle{font-size:29px;font-weight:850;letter-spacing:-.045em;margin:6px 0 5px}.quiet{color:var(--muted);font-size:13px;line-height:1.5}.hero{border:1px solid #6c2333;border-radius:23px;padding:20px;box-shadow:0 16px 35px #0008,0 0 30px #a51b2b14;background:radial-gradient(circle at 100% -20%,#9a14393c,transparent 42%),linear-gradient(145deg,#241017,#111115 75%);margin:19px 0 12px;position:relative;overflow:hidden}.heroHead{display:flex;align-items:start;justify-content:space-between}.heroNum{font-size:43px;font-weight:900;letter-spacing:-.06em;line-height:1.1}.heroNum small{font-size:16px;font-weight:500;color:var(--muted);letter-spacing:0}.target{font-size:12px;color:#bbb0b5;margin:7px 0 15px}.progress{height:8px;background:#42272f;border-radius:10px;overflow:hidden}.progress>div{height:100%;background:linear-gradient(90deg,#f02944,#ff6a6a);box-shadow:0 0 14px #ff304d;transition:width .3s;width:0}.macros{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:23px}.macro{background:#151519;border:1px solid #2e252b;border-radius:16px;padding:14px 10px}.macro b{display:block;font-size:19px;letter-spacing:-.03em}.macro span{color:var(--muted);font-size:10px}.sectionTitle{display:flex;justify-content:space-between;align-items:center;margin:17px 0 14px}.sectionTitle h2{font-size:18px;margin:0}.count{color:#a9a4a8;font-size:11px}.meal{background:var(--panel);border:1px solid #30242a;border-radius:20px;margin-bottom:12px;overflow:hidden;box-shadow:0 5px 20px #0003}.meal.checked{border-color:#7f3845}.mealMain{display:flex;gap:13px;padding:12px;align-items:center}.photo{position:relative;flex:0 0 98px;width:98px;height:98px;border-radius:14px;overflow:hidden;background:radial-gradient(circle,#5d2834,#201019)}.photo img{width:100%;height:100%;object-fit:cover;display:block}.photo .emoji{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;z-index:0}.photo img{position:relative;z-index:1}.mealText{min-width:0;flex:1}.mealTag{color:var(--bright);font-size:10px;text-transform:uppercase;font-weight:800;letter-spacing:.1em}.mealTitle{font-size:16px;margin:5px 0;font-weight:800}.mealDesc{font-size:11px;color:#aca5ac;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mealMacro{font-size:11px;margin-top:9px;color:#d0c7ca}.mealMacro b{font-size:15px;color:white;margin-right:8px}.actions{display:flex;border-top:1px solid #30262a}.actions button{flex:1;padding:13px;border:0;background:#18161a;color:#d4c9cf;font-size:12px;font-weight:700}.actions button+button{border-left:1px solid #30262a}.actions .done{color:var(--bright)}.actions .isDone{color:#fff;background:#5b1d2d}.note{border-left:3px solid #dd2843;padding:10px 14px;background:#151115;border-radius:0 10px 10px 0;color:#ad9fa5;font-size:12px;line-height:1.5;margin-top:15px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:600px;width:100%;display:grid;grid-template-columns:repeat(3,1fr);background:#101013ee;border-top:1px solid #40242e;backdrop-filter:blur(18px);padding:8px 10px max(9px,env(safe-area-inset-bottom));z-index:10}.nav{border:0;background:transparent;color:#91868d;font-size:11px;font-weight:750;padding:8px;display:grid;justify-items:center;gap:5px}.nav span{font-size:20px}.nav.active{color:#ff4d64}.sheetBackdrop{position:fixed;inset:0;background:#000c;z-index:19;display:none}.sheetBackdrop.show{display:block}.sheet{position:fixed;bottom:0;left:50%;transform:translateX(-50%);background:#18151a;border:1px solid #6a2c3e;border-radius:23px 23px 0 0;width:min(600px,100%);max-height:86vh;overflow:auto;padding:22px 18px max(28px,env(safe-area-inset-bottom));z-index:20;display:none}.sheet.show{display:block}.sheet h2{margin:0 0 15px}.field{display:block;margin:13px 0}.field label{display:block;color:#bdb0b7;font-size:12px;margin-bottom:7px}.field input,.field select{width:100%;border-radius:11px;padding:12px;background:#100f13;border:1px solid #4b303a;color:#fff;outline:none}.ingredients{display:grid;gap:8px}.ingred{display:flex;align-items:center;justify-content:space-between;gap:12px;background:#222025;border-radius:10px;padding:9px 12px}.ingred span{font-size:12px;flex:1}.ingred input{width:82px;border:1px solid #613443;background:#0d0c10;border-radius:8px;color:white;padding:10px}.ingred .unit{font-size:11px;color:#bdb0b7}.btn{width:100%;border:1px solid #f43b56;border-radius:13px;padding:13px;color:#fff;background:linear-gradient(90deg,#ae1c39,#ef2e49);font-weight:800;margin-top:16px}.btn.secondary{background:#242127;border-color:#583441}.smallBtn{padding:9px 11px;border-radius:9px;background:#24161c;border:1px solid #70303b;color:#fff;font-size:12px}.settingsCard{background:var(--panel);border:1px solid var(--line);padding:17px;border-radius:18px;margin:12px 0}.settingsCard h3{margin:0 0 8px;font-size:16px}.settingsCard p{font-size:12px;color:var(--muted);line-height:1.5}.dailyRow{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #3b2930;padding:12px 0;font-size:13px}.dailyRow b{color:var(--bright)}.empty{padding:40px 12px;text-align:center;color:#aaa}.hidden{display:none!important}
</style></head><body><div class="app"><header class="top"><div class="brand"><div class="brandicon">⚡</div><div><div class="name">MINHA <em>DIETA</em></div><div class="sub">ANDRÉ22 • NUTRIÇÃO</div></div></div><button class="circleBtn" onclick="showSettings()" aria-label="Ajustes">⚙</button></header><main id="screen" class="content"></main><nav class="bottom"><button class="nav active" data-page="today" onclick="navigate('today')"><span>▦</span>Minha dieta</button><button class="nav" data-page="history" onclick="navigate('history')"><span>◷</span>Histórico</button><button class="nav" data-page="settings" onclick="navigate('settings')"><span>⚙</span>Ajustes</button></nav></div><div class="sheetBackdrop" onclick="closeSheet()"></div><section id="sheet" class="sheet"></section>
<script>
'use strict';
const catalogue={whey:{n:'Whey protein',unit:'g',k:4,p:.8,c:.08,f:.05},riceflour:{n:'Farinha de arroz pré-cozida',unit:'g',k:3.6,p:.06,c:.8,f:.005},neston:{n:'Neston 3 Cereais',unit:'g',k:3.65,p:.08,c:.79,f:.02},milkyflour:{n:'Farinha láctea',unit:'g',k:4.1,p:.09,c:.77,f:.05},milk:{n:'Leite desnatado',unit:'ml',k:.35,p:.035,c:.05,f:.001},peanut:{n:'Pasta de amendoim',unit:'g',k:6,p:.25,c:.2,f:.5},rice:{n:'Arroz branco cozido',unit:'g',k:1.3,p:.026,c:.28,f:.003},chicken:{n:'Peito de frango cozido',unit:'g',k:1.65,p:.31,c:0,f:.036},veggies:{n:'Legumes e verduras',unit:'g',k:.35,p:.02,c:.06,f:.002},oil:{n:'Azeite',unit:'g',k:9,p:0,c:0,f:1},banana:{n:'Banana',unit:'g',k:.89,p:.011,c:.23,f:.003},oats:{n:'Aveia',unit:'g',k:3.89,p:.17,c:.66,f:.07},egg:{n:'Ovo inteiro',unit:'g',k:1.55,p:.13,c:.01,f:.11}};
const shakes=[{key:'whey',qty:15},{key:'riceflour',qty:30},{key:'neston',qty:20},{key:'milkyflour',qty:10},{key:'milk',qty:200},{key:'peanut',qty:10}];
const solids=[{key:'rice',qty:200},{key:'chicken',qty:190},{key:'veggies',qty:150},{key:'oil',qty:10}];
function defaults(){return {version:1,targets:{kcal:2670,protein:210,carbs:310,fat:57},meals:[{id:'m1',title:'Shake da manhã',kind:'shake',time:'1ª REFEIÇÃO',foods:structuredCloneSafe(shakes)},{id:'m2',title:'Almoço',kind:'food',time:'2ª REFEIÇÃO',foods:structuredCloneSafe(solids)},{id:'m3',title:'Shake do treino',kind:'shake',time:'3ª REFEIÇÃO',foods:structuredCloneSafe(shakes)},{id:'m4',title:'Jantar',kind:'food',time:'4ª REFEIÇÃO',foods:structuredCloneSafe(solids)},{id:'m5',title:'Shake da noite',kind:'shake',time:'5ª REFEIÇÃO',foods:structuredCloneSafe(shakes)}],checks:{}};}
function structuredCloneSafe(v){return JSON.parse(JSON.stringify(v));}
function load(){try{const d=JSON.parse(localStorage.getItem('minhadieta-v1'));return validState(d)?d:defaults();}catch(e){return defaults();}}
function validState(v){return v&&Array.isArray(v.meals)&&v.meals.length>=1&&v.meals.length<=15&&v.meals.every(m=>m&&typeof m.title==='string'&&Array.isArray(m.foods)&&m.foods.every(f=>catalogue[f.key]&&Number.isFinite(+f.qty)&&+f.qty>=0&&+f.qty<=3000));}
let state=load(),page='today',currentMeal=null;const n=v=>Math.round(v),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const day=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function save(){localStorage.setItem('minhadieta-v1',JSON.stringify(state));}
function macros(meal){return meal.foods.reduce((m,f)=>{const x=catalogue[f.key];for(const k of ['k','p','c','f'])m[k]+=(+f.qty||0)*x[k];return m},{k:0,p:0,c:0,f:0});}
function total(){return state.meals.reduce((s,m)=>{const x=macros(m);for(const k of ['k','p','c','f'])s[k]+=x[k];return s},{k:0,p:0,c:0,f:0});}
function done(){return state.checks[day()]||[];}function toggle(id){const d=new Set(done());d.has(id)?d.delete(id):d.add(id);state.checks[day()]=[...d];save();render();}
function navigate(p){page=p;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===p));render();}
function render(){const el=document.getElementById('screen');if(page==='settings')return el.innerHTML=settingsHTML();if(page==='history')return el.innerHTML=historyHTML();const t=total(),completed=done();const consumed=state.meals.filter(m=>completed.includes(m.id)).reduce((s,m)=>s+macros(m).k,0);const fmt=new Intl.DateTimeFormat('pt-BR',{weekday:'long',day:'numeric',month:'long'}).format(new Date());let out=`<div class="eyebrow">PLANO ALIMENTAR • 98 KG</div><div class="pageTitle">Sua dieta de hoje.</div><div class="quiet">${esc(fmt)} · Ganho muscular controlado</div><section class="hero"><div class="heroHead"><div><div class="eyebrow">CALORIAS PLANEJADAS</div><div class="heroNum">${n(t.k).toLocaleString('pt-BR')} <small>kcal</small></div></div><span style="font-size:28px">🔥</span></div><div class="target">Meta de referência: ${n(state.targets.kcal)} kcal · Consumidas: ${n(consumed)} kcal</div><div class="progress"><div style="width:${Math.min(100,Math.round(consumed/Math.max(1,t.k)*100))}%"></div></div></section><div class="macros"><div class="macro"><b>${n(t.p)}g</b><span>PROTEÍNAS</span></div><div class="macro"><b>${n(t.c)}g</b><span>CARBOIDRATOS</span></div><div class="macro"><b>${n(t.f)}g</b><span>GORDURAS</span></div></div><div class="sectionTitle"><h2>Suas 5 refeições</h2><div class="count">${completed.length}/${state.meals.length} concluídas</div></div>`;for(const m of state.meals){const x=macros(m),checked=completed.includes(m.id),isShake=m.kind==='shake',desc=m.foods.map(f=>`${n(f.qty)}${catalogue[f.key].unit} ${catalogue[f.key].n}`).slice(0,2).join(' · ');out+=`<article class="meal ${checked?'checked':''}"><div class="mealMain"><div class="photo"><div class="emoji">${isShake?'🥤':'🍱'}</div><img src="${isShake?'shake.jpg':'meal.jpg'}" alt="${isShake?'Shake proteico':'Arroz, frango e legumes'}" onerror="this.style.display='none'"></div><div class="mealText"><div class="mealTag">${esc(m.time||'REFEIÇÃO')}</div><div class="mealTitle">${esc(m.title)}</div><div class="mealDesc">${esc(desc)}</div><div class="mealMacro"><b>${n(x.k)} kcal</b>${n(x.p)}g prot. · ${n(x.c)}g carb.</div></div></div><div class="actions"><button onclick="editMeal('${esc(m.id)}')">✎ Editar porções</button><button class="${checked?'isDone':'done'}" onclick="toggle('${esc(m.id)}')">${checked?'✓ Concluída':'○ Marcar como feita'}</button></div></article>`;}out+='<div class="note">Valores nutricionais aproximados, sujeitos às marcas e ao preparo. A farinha de arroz deve ser pré-cozida ou preparada antes do consumo. O registro fica somente neste aparelho.</div>';el.innerHTML=out;}
function historyHTML(){const entries=Object.entries(state.checks).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,30);return `<div class="eyebrow">ACOMPANHAMENTO</div><div class="pageTitle">Histórico</div><p class="quiet">Registros salvos no seu celular, mesmo sem internet.</p><div class="settingsCard"><h3>Dias registrados</h3>${entries.length?entries.map(([date,ids])=>`<div class="dailyRow"><span>${esc(date.split('-').reverse().join('/'))}</span><b>${ids.length}/${state.meals.length} refeições</b></div>`).join(''):'<p>Nenhum dia registrado ainda. Marque as refeições de hoje para começar.</p>'}</div>`;}
function settingsHTML(){return `<div class="eyebrow">CONTROLE PESSOAL</div><div class="pageTitle">Ajustes</div><p class="quiet">Sem senha, sem conta e sem conexão com a internet.</p><div class="settingsCard"><h3>🎯 Metas diárias</h3><div class="field"><label>Calorias (kcal)</label><input id="goalK" type="number" min="1000" max="5000" value="${n(state.targets.kcal)}"></div><div class="field"><label>Proteínas (g)</label><input id="goalP" type="number" min="0" max="500" value="${n(state.targets.protein)}"></div><button class="btn" onclick="saveGoals()">Salvar metas</button></div><div class="settingsCard"><h3>📥 Atualizar dieta</h3><p>Peça sua alteração aqui no ChatGPT. Depois importe o arquivo .json que eu preparar. O aplicativo atualiza suas refeições e preserva seu histórico.</p><button class="btn" onclick="importDiet()">Importar dieta (.json)</button><button class="btn secondary" onclick="exportDiet()">Exportar cópia de segurança</button></div><div class="settingsCard"><h3>🔐 Privacidade</h3><p>Todas as informações ficam armazenadas localmente no celular. Não existe login, servidor, publicidade ou sincronização automática.</p><p>Desinstalar o aplicativo pode apagar os dados. Exporte um backup antes.</p></div>`;}
function saveGoals(){state.targets.kcal=Math.max(1000,Math.min(5000,+document.getElementById('goalK').value||2670));state.targets.protein=Math.max(0,Math.min(500,+document.getElementById('goalP').value||210));save();render();alert('Metas atualizadas.');}
function editMeal(id){const m=state.meals.find(x=>x.id===id);if(!m)return;currentMeal=id;let items=m.foods.map((f,i)=>`<div class="ingred"><span>${esc(catalogue[f.key].n)}</span><input type="number" inputmode="decimal" min="0" max="3000" step="1" data-idx="${i}" value="${+f.qty}" aria-label="Quantidade de ${esc(catalogue[f.key].n)}"><span class="unit">${catalogue[f.key].unit}</span></div>`).join('');document.getElementById('sheet').innerHTML=`<div class="eyebrow">AJUSTAR ALIMENTAÇÃO</div><h2>${esc(m.title)}</h2><div class="ingredients">${items}</div><div class="field"><label>Adicionar alimento</label><select id="newfood"><option value="">Selecione...</option>${Object.entries(catalogue).filter(([k])=>!m.foods.some(f=>f.key===k)).map(([k,v])=>`<option value="${k}">${esc(v.n)}</option>`).join('')}</select></div><button class="smallBtn" onclick="addFood()">+ Adicionar alimento</button><button class="btn" onclick="saveMeal()">Salvar quantidades</button><button class="btn secondary" onclick="closeSheet()">Cancelar</button>`;openSheet();}
function saveMeal(){const m=state.meals.find(x=>x.id===currentMeal);document.querySelectorAll('.ingred input').forEach(input=>{const idx=+input.dataset.idx;if(m.foods[idx])m.foods[idx].qty=Math.max(0,Math.min(3000,+input.value||0));});save();closeSheet();render();}
function addFood(){const key=document.getElementById('newfood').value;if(!key||!catalogue[key])return;saveMeal();const m=state.meals.find(x=>x.id===currentMeal);if(!m)return;m.foods.push({key,qty:100});save();editMeal(m.id);}
function openSheet(){document.querySelector('.sheetBackdrop').classList.add('show');document.getElementById('sheet').classList.add('show');}function closeSheet(){document.querySelector('.sheetBackdrop').classList.remove('show');document.getElementById('sheet').classList.remove('show');}function showSettings(){navigate('settings')}
function importDiet(){if(window.Android&&Android.importDiet){Android.importDiet();}else{alert('A importação funciona no APK Android.');}}
function exportDiet(){const json=JSON.stringify(state,null,2);if(window.Android&&Android.exportDiet){Android.exportDiet(json);}else{alert('Exportação disponível no APK Android.');}}
window.receiveDietImport=function(json){try{const d=JSON.parse(json);if(!validState(d))throw Error('Formato inválido');const original=state.checks||{};state={version:1,meals:d.meals.map((m,i)=>({id:String(m.id||('m'+(i+1))),title:String(m.title).slice(0,80),time:String(m.time||`${i+1}ª REFEIÇÃO`).slice(0,30),kind:m.kind==='food'?'food':'shake',foods:m.foods.map(f=>({key:f.key,qty:+f.qty}))})),targets:{...defaults().targets,...(d.targets||{})},checks:original};save();navigate('today');alert('Dieta atualizada! Seu histórico foi preservado.');}catch(e){alert('Não foi possível importar este arquivo de dieta.');}};
window.onAndroidBack=function(){if(document.getElementById('sheet').classList.contains('show'))closeSheet();else navigate('today');};render();
</script></body></html>
